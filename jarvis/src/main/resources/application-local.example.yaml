spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:postgres}?sslmode=${PG_SSL_MODE:disable}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:}

jarvis:
  llm:
    api-key: ${LLM_API_KEY:}
    api-base: ${LLM_API_BASE:https://easyrouter.io}
    model: ${LLM_MODEL:deepseek-v4-pro}
    log-request-body: ${JARVIS_LLM_LOG_REQUEST_BODY:false}
    retry:
      max-retries: ${JARVIS_LLM_MAX_RETRIES:3}
      initial-backoff-ms: ${JARVIS_LLM_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${JARVIS_LLM_MAX_BACKOFF_MS:8000}
    circuit-breaker:
      enabled: ${JARVIS_LLM_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${JARVIS_LLM_CIRCUIT_FAILURE_THRESHOLD:3}
      recovery-timeout-ms: ${JARVIS_LLM_CIRCUIT_RECOVERY_TIMEOUT_MS:60000}
    fallback-providers:
      - enabled: ${SILICONFLOW_ENABLED:false}
        provider: siliconflow
        api-key: ${SILICONFLOW_API_KEY:}
        api-base: ${SILICONFLOW_API_BASE:https://api.siliconflow.cn}
        model: ${SILICONFLOW_MODEL:Qwen/Qwen3-235B-A22B}
      - enabled: ${BAILIAN_ENABLED:false}
        provider: bailian
        api-key: ${BAILIAN_API_KEY:}
        api-base: ${BAILIAN_API_BASE:https://dashscope.aliyuncs.com/compatible-mode}
        model: ${BAILIAN_MODEL:qwen-plus}

  agent:
    workspace: ${JARVIS_WORKSPACE:./workspace}
    workspaces:
      - id: jarvis
        label: Jarvis workspace
        path: ${JARVIS_WORKSPACE:./workspace}
      - id: project
        label: Project workspace
        path: ${JARVIS_PROJECT_WORKSPACE:.}
    context-budget:
      enabled: ${JARVIS_CONTEXT_BUDGET_ENABLED:true}
      max-input-tokens: ${JARVIS_CONTEXT_MAX_INPUT_TOKENS:16000}
      max-tool-result-chars: ${JARVIS_CONTEXT_MAX_TOOL_RESULT_CHARS:2000}
      max-context-block-chars: ${JARVIS_CONTEXT_MAX_CONTEXT_BLOCK_CHARS:4000}
      keep-recent-messages: ${JARVIS_CONTEXT_KEEP_RECENT_MESSAGES:12}

  subagent:
    max-runtime-seconds: ${JARVIS_SUBAGENT_MAX_RUNTIME_SECONDS:600}

  planner:
    enabled: ${JARVIS_PLANNER_ENABLED:true}
    super-agent-always-plan: ${JARVIS_PLANNER_SUPER_AGENT_ALWAYS_PLAN:true}
    complexity-threshold: ${JARVIS_PLANNER_COMPLEXITY_THRESHOLD:5}
    min-message-chars: ${JARVIS_PLANNER_MIN_MESSAGE_CHARS:12}

  auth:
    enabled: true
    registration-enabled: ${JARVIS_AUTH_REGISTRATION_ENABLED:true}
    bootstrap-password: ${JARVIS_AUTH_BOOTSTRAP_PASSWORD:}
    allowed-origins: ${JARVIS_AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

  mcp:
    enabled: true
    local-tools: true
    external-servers:
      - name: zhipu-web-search-sse
        transport: sse
        url: https://open.bigmodel.cn/api/mcp-broker/proxy/web-search/sse
        headers:
          Authorization: Bearer ${ZHIPU_API_KEY:}

  channels:
    feishu:
      enabled: ${JARVIS_FEISHU_ENABLED:false}
      app-id: ${JARVIS_FEISHU_APP_ID:}
      app-secret: ${JARVIS_FEISHU_APP_SECRET:}
      encrypt-key: ${JARVIS_FEISHU_ENCRYPT_KEY:}
      verification-token: ${JARVIS_FEISHU_VERIFICATION_TOKEN:}
      allow-from: ${JARVIS_FEISHU_ALLOW_FROM:}

  image-gen:
    api-key: ${IMAGE_GEN_API_KEY:}

  vision:
    enabled: ${JARVIS_VISION_ENABLED:false}
    api-base: ${JARVIS_VISION_API_BASE:https://dashscope.aliyuncs.com/compatible-mode}
    api-key: ${JARVIS_VISION_API_KEY:${BAILIAN_API_KEY:}}
    model: ${JARVIS_VISION_MODEL:qwen3-vl-flash}
    max-tokens: ${JARVIS_VISION_MAX_TOKENS:1200}

  sandbox:
    backend: ${JARVIS_SANDBOX_BACKEND:os}
    base-url: ${JARVIS_SANDBOX_BASE_URL:http://localhost:8090}
    host-root: ${JARVIS_SANDBOX_HOST_ROOT:${JARVIS_PROJECT_WORKSPACE:.}}
    sandbox-root: ${JARVIS_SANDBOX_ROOT:/workspace}
    os:
      mode: ${JARVIS_OS_SANDBOX_MODE:workspace-write}
      network-access: ${JARVIS_OS_SANDBOX_NETWORK_ACCESS:false}
      allow-temp-write: ${JARVIS_OS_SANDBOX_ALLOW_TEMP_WRITE:true}
      timeout-seconds: ${JARVIS_OS_SANDBOX_TIMEOUT_SECONDS:60}
      max-output-chars: ${JARVIS_OS_SANDBOX_MAX_OUTPUT_CHARS:100000}

  concurrency:
    enabled: ${JARVIS_CONCURRENCY_ENABLED:true}
    max-concurrent-agents: ${JARVIS_MAX_CONCURRENT_AGENTS:8}
    max-concurrent-agents-per-user: ${JARVIS_MAX_CONCURRENT_AGENTS_PER_USER:2}
    max-queued-agents: ${JARVIS_MAX_QUEUED_AGENTS:128}
    max-queued-agents-per-user: ${JARVIS_MAX_QUEUED_AGENTS_PER_USER:16}
    max-queued-agents-per-session: ${JARVIS_MAX_QUEUED_AGENTS_PER_SESSION:8}
    message-queue-capacity: ${JARVIS_MESSAGE_QUEUE_CAPACITY:256}
    max-concurrent-llm-calls: ${JARVIS_MAX_CONCURRENT_LLM_CALLS:8}
    max-concurrent-memory-calls: ${JARVIS_MAX_CONCURRENT_MEMORY_CALLS:16}
    max-concurrent-tools: ${JARVIS_MAX_CONCURRENT_TOOLS:16}
    max-concurrent-tools-per-session: ${JARVIS_MAX_CONCURRENT_TOOLS_PER_SESSION:4}
    max-concurrent-subagents: ${JARVIS_MAX_CONCURRENT_SUBAGENTS:8}
    max-concurrent-subagents-per-session: ${JARVIS_MAX_CONCURRENT_SUBAGENTS_PER_SESSION:3}
    max-concurrent-async-hooks: ${JARVIS_MAX_CONCURRENT_ASYNC_HOOKS:32}
    acquire-timeout-ms: ${JARVIS_CONCURRENCY_ACQUIRE_TIMEOUT_MS:30000}
