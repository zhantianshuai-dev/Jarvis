spring:
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DATABASE:postgres}?sslmode=${PG_SSL_MODE:disable}
    username: ${PG_USER:postgres}
    password: ${PG_PASSWORD:}

jarvis:
  llm:
    api-key: ${LLM_API_KEY:}
    api-base: ${LLM_API_BASE:https://easyrouter.io}
    model: ${LLM_MODEL:deepseek-v4-pro}
    log-request-body: ${JARVIS_LLM_LOG_REQUEST_BODY:false}
    retry:
      max-retries: ${JARVIS_LLM_MAX_RETRIES:3}
      initial-backoff-ms: ${JARVIS_LLM_INITIAL_BACKOFF_MS:1000}
      max-backoff-ms: ${JARVIS_LLM_MAX_BACKOFF_MS:8000}
    circuit-breaker:
      enabled: ${JARVIS_LLM_CIRCUIT_BREAKER_ENABLED:true}
      failure-threshold: ${JARVIS_LLM_CIRCUIT_FAILURE_THRESHOLD:3}
      recovery-timeout-ms: ${JARVIS_LLM_CIRCUIT_RECOVERY_TIMEOUT_MS:60000}
    fallback-providers:
      - enabled: ${SILICONFLOW_ENABLED:false}
        provider: siliconflow
        api-key: ${SILICONFLOW_API_KEY:}
        api-base: ${SILICONFLOW_API_BASE:https://api.siliconflow.cn}
        model: ${SILICONFLOW_MODEL:Qwen/Qwen3-235B-A22B}
      - enabled: ${BAILIAN_ENABLED:false}
        provider: bailian
        api-key: ${BAILIAN_API_KEY:}
        api-base: ${BAILIAN_API_BASE:https://dashscope.aliyuncs.com/compatible-mode}
        model: ${BAILIAN_MODEL:qwen-plus}

  agent:
    workspace: ${JARVIS_WORKSPACE:./workspace}
    workspaces:
      - id: jarvis
        label: Jarvis workspace
        path: ${JARVIS_WORKSPACE:./workspace}
      - id: project
        label: openViking project
        path: ${JARVIS_PROJECT_WORKSPACE:.}

  auth:
    enabled: true
    registration-enabled: ${JARVIS_AUTH_REGISTRATION_ENABLED:true}
    bootstrap-password: ${JARVIS_AUTH_BOOTSTRAP_PASSWORD:}
    allowed-origins: ${JARVIS_AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}

  mcp:
    enabled: true
    local-tools: true
    external-servers:
      - name: zhipu-web-search-sse
        transport: sse
        url: https://open.bigmodel.cn/api/mcp-broker/proxy/web-search/sse
        headers:
          Authorization: Bearer ${ZHIPU_API_KEY:}

  channels:
    feishu:
      enabled: ${JARVIS_FEISHU_ENABLED:false}
      app-id: ${JARVIS_FEISHU_APP_ID:}
      app-secret: ${JARVIS_FEISHU_APP_SECRET:}
      encrypt-key: ${JARVIS_FEISHU_ENCRYPT_KEY:}
      verification-token: ${JARVIS_FEISHU_VERIFICATION_TOKEN:}
      allow-from: ${JARVIS_FEISHU_ALLOW_FROM:}

  image-gen:
    api-key: ${IMAGE_GEN_API_KEY:}
